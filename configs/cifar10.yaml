trainer:
  name: "CIFA10"
  train_batch_size: 128
  val_batch_size: 64
  tensorboard_log_dir: "/content/logs"
  lr: 2e-4
  device: "auto"
  load_ckpt: False
  
encoder:
  resolution: 32
  in_channels: 3
  out_channels: 3
  num_resblocks: 3
  ch_factor: 64
  ch_mult: [1, 2, 4]


quantizer:
  type: "ema"
  params:
    codebook_size: 2048
    embed_dim: 3
    commit_cost: 0.5

decoder:
  resolution: 32
  in_channels: 3
  out_channels: 3
  num_resblocks: 3
  attn_resolutions: []
  ch: 64
  ch_mult: [1, 4, 4]


perceptual_loss:
  layers: [1,6,11,20,29]
  normalized: True
  scale: 0.01

