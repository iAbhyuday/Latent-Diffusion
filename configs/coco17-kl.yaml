trainer:
  name: "Coco17-16x16x8-kl"
  train_batch_size: 32
  val_batch_size: 32
  max_epochs: 70
  tensorboard_log_dir: "/mnt/sda/ab/projects/FY24/cmc/logs"
  lr: 4.5e-6
  device: "cuda"
  warmup: False
  warmup_steps: 0.05
  load_ckpt: False
  checkpoint_dir: "/media/z004e29c/mlinux/abhyuday/projects/Latent-Diffusion/models/"
  
encoder:
  resolution: 128
  in_channels: 3
  out_channels: 128
  num_resblocks: 3
  ch_factor: 64
  ch_mult: [1, 2, 4, 4]
  attn_resolutions: [16]

quantizer:
  type: "kl"
  params:
    in_channels: 64
    embed_dim: 8
    beta: 1e-5
    reduce_mean: True

decoder:
  resolution: 128
  in_channels: 8
  out_channels: 3
  num_resblocks: 3
  attn_resolutions: [16]
  ch: 64
  ch_mult: [1, 2, 4, 4]

disc_config:
  input_nc: 3
  ndf: 64
  n_layers: 
  lr: 


perceptual_loss:
  layers: [1, 6, 11, 20, 29]
  normalized: True
  scale: 1.0

